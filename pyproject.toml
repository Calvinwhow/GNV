[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gnv"
version = "0.1.0"
description = "Layered brain-figure viewer: meshes, volumes and tractograms as editable layers."
requires-python = ">=3.9"
dependencies = [
    "flask>=3.0",
    "pyvista>=0.44",
    "nibabel",
    "scipy",
    "numpy",
    "pillow",
    "matplotlib",
    "h5py",
    "scikit-image",
    "mitsuba",
    "calvin_utils @ git+https://github.com/Calvinwhow/CircuitPyPer.git@development",
]

[project.scripts]
gnv = "gnv.app:main"

[tool.setuptools.packages.find]
include = ["gnv*"]

[tool.setuptools.package-data]
gnv = ["static/*", "volumes/*"]
