<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>circuit viewer</title>
<style>
:root{
  --bg:#14161a; --panel:#1b1e24; --panel-2:#22262e; --line:#2e333d;
  --ink:#e6e9ef; --ink-dim:#9aa3b2; --accent:#7aa2d8; --danger:#c15656;
  --radius:7px; --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  display:flex;background:var(--bg);color:var(--ink);
  font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;
  overflow:hidden;
}
button,select,input{font:inherit;color:inherit}
button{
  background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius);
  padding:5px 10px;cursor:pointer;
}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#0f1216;font-weight:600}
button.icon{padding:3px 7px;background:none;border:none;color:var(--ink-dim)}
button.icon:hover{color:var(--ink)}
select,input[type=text],input[type=number]{
  background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);
  padding:4px 7px;width:100%;
}
input[type=color]{
  width:30px;height:26px;padding:0;border:1px solid var(--line);
  border-radius:var(--radius);background:none;cursor:pointer;
}
input[type=range]{width:100%;accent-color:var(--accent)}

/* ---- panel ---- */
#panel{
  width:340px;flex:0 0 340px;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;
}
#panel header{
  padding:12px 14px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:8px;
}
#panel header h1{font-size:13px;margin:0;font-weight:600;letter-spacing:.3px;flex:1}
#panel header .v{color:var(--ink-dim);font-size:11px}
#toolbar{display:flex;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
#toolbar button{flex:1;min-width:64px;font-size:12px}
#layers{flex:1;overflow-y:auto;padding:10px 12px}
#add{display:flex;gap:6px;padding:10px 14px;border-top:1px solid var(--line)}
#newgroup{
  margin:0 12px 10px;padding:14px 10px;border:1.5px dashed var(--line);
  border-radius:var(--radius);text-align:center;cursor:pointer;
  display:flex;flex-direction:column;gap:3px;color:var(--ink-dim);
}
#newgroup strong{color:var(--ink);font-size:12px;font-weight:600}
#newgroup span{font-size:11px}
#newgroup:hover{border-color:var(--accent)}
#newgroup.over,.layer.over{border-color:var(--accent);background:rgba(122,162,216,.14)}
.layer.over{border-style:dashed}
#add button{flex:1}

/* ---- layer card ---- */
.layer{
  background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius);
  margin-bottom:8px;overflow:hidden;
}
.layer.sel{border-color:var(--accent)}
.layer .head{display:flex;align-items:center;gap:6px;padding:7px 9px;cursor:pointer}
.layer .head .name{flex:1;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.layer .head .badge{
  font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-dim);
  border:1px solid var(--line);border-radius:3px;padding:1px 5px;
}
.layer.hidden .name{opacity:.45;text-decoration:line-through}
.layer .body{padding:4px 9px 11px;border-top:1px solid var(--line);display:none}
.layer.open .body{display:block}
.row{display:flex;align-items:center;gap:8px;margin-top:8px}
.row label{flex:0 0 88px;color:var(--ink-dim);font-size:12px}
.row .grow{flex:1;min-width:0}
.row.stack{display:block}
.row.stack label{display:block;margin-bottom:4px}
.hint{color:var(--ink-dim);font-size:11px;margin-top:7px;line-height:1.4}
.pathbox{display:flex;gap:5px}
.inline{display:flex;gap:6px;align-items:center}
.pathbox input{font-family:var(--mono);font-size:11px}
#scenepanel{border-top:1px solid var(--line);padding:8px 14px 12px}
#scenepanel summary{cursor:pointer;color:var(--ink-dim);font-size:11px;
  text-transform:uppercase;letter-spacing:.6px;padding:3px 0}
.fold{margin-top:10px;border:1px solid var(--line);border-radius:var(--radius);padding:6px 8px}
.fold summary{cursor:pointer;color:var(--ink-dim);font-size:11px;
  text-transform:uppercase;letter-spacing:.6px}
.supra{display:flex;flex-wrap:wrap;gap:4px 10px;margin:6px 0 2px}
.supra-item{display:flex;gap:5px;align-items:center;font-size:11px;
  color:var(--ink-dim);cursor:pointer;white-space:nowrap}
.region-list{max-height:210px;overflow-y:auto;margin-top:6px}
.region{display:flex;gap:7px;align-items:center;padding:2px 0;font-size:12px;cursor:pointer}
.region span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#lightpanel{border-top:1px solid var(--line);padding:8px 14px 12px;max-height:44vh;overflow-y:auto}
#lightpanel summary{cursor:pointer;color:var(--ink-dim);font-size:11px;
  text-transform:uppercase;letter-spacing:.6px;padding:3px 0}
#lightpanel button{margin-top:10px;width:100%}
.ovl{border:1px solid var(--line);border-radius:var(--radius);margin-top:8px;
  background:rgba(255,255,255,.02)}
.ovl-head{display:flex;align-items:center;gap:6px;padding:6px 8px}
.ovl-head .name{flex:1;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ovl-body{padding:0 8px 8px;border-top:1px solid var(--line)}
.sec{
  margin-top:12px;padding-top:9px;border-top:1px dashed var(--line);
  color:var(--ink-dim);font-size:11px;text-transform:uppercase;letter-spacing:.6px;
}

/* ---- viewport ---- */
#view{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
#viewbar{
  display:flex;align-items:center;gap:6px;padding:9px 14px;
  border-bottom:1px solid var(--line);background:var(--panel);
}
#viewbar .spacer{flex:1}
#viewbar button{font-size:12px;padding:4px 9px}
#viewbar button.on{border-color:var(--accent);color:var(--accent)}
#stage{flex:1;position:relative;overflow:hidden;background:#0f1216;cursor:grab}
#stage.drag{cursor:grabbing}
#stage.over{outline:2px dashed var(--accent);outline-offset:-10px}
#shot{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}
#status{
  padding:6px 14px;border-top:1px solid var(--line);background:var(--panel);
  color:var(--ink-dim);font-size:11px;font-family:var(--mono);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
#status.err{color:var(--danger)}
#spin{
  position:absolute;top:12px;right:14px;width:11px;height:11px;border-radius:50%;
  border:2px solid var(--line);border-top-color:var(--accent);animation:sp .7s linear infinite;
  display:none;
}
#spin.on{display:block}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---- modal ---- */
#modal{
  position:fixed;inset:0;background:rgba(8,10,13,.72);display:none;
  align-items:center;justify-content:center;z-index:20;
}
#modal.on{display:flex}
#modal .box{
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
  width:620px;max-height:74vh;display:flex;flex-direction:column;
}
#modal h2{font-size:13px;margin:0;padding:12px 14px;border-bottom:1px solid var(--line)}
#modal .cwd{padding:8px 14px;font-family:var(--mono);font-size:11px;color:var(--ink-dim);
  border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
#modal .cwd input{flex:1}
#list{flex:1;overflow-y:auto;padding:6px 0}
#list div{padding:5px 14px;cursor:pointer;font-family:var(--mono);font-size:12px;
  display:flex;gap:8px;align-items:center}
#list div:hover{background:var(--panel-2)}
#list .d{color:var(--accent)}
#list .sel{background:var(--panel-2);outline:1px solid var(--accent)}
#m-folder{display:none}
#modal.pick-many #m-folder{display:inline-block}
#modal footer{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:8px}
#modal footer input{flex:1;font-family:var(--mono);font-size:11px}
#anim{position:absolute;right:14px;bottom:40px;width:300px;display:none;z-index:20;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:6px 10px 10px;font-size:12px;box-shadow:0 6px 24px rgba(0,0,0,.35)}
#anim.on{display:block}
#anim header{display:flex;align-items:center;justify-content:space-between;padding:2px 0 4px}
#anim .arow{display:flex;gap:6px;align-items:center;margin:5px 0;flex-wrap:wrap}
#anim .arow input[type=number]{width:4em}
#anim .arow select{flex:1}
#anim .sec{margin-top:8px}
</style>
</head>
<body>
<div id="panel">
  <header><h1>circuit viewer</h1><span class="v" id="ver"></span></header>
  <div id="toolbar">
    <button id="b-new">New</button>
    <button id="b-open">Open</button>
    <button id="b-save">Save</button>
    <button id="b-export" class="primary">Export PNG</button>
  </div>
  <div id="layers"></div>
  <details id="scenepanel"><summary>Scene</summary><div id="scene"></div></details>
  <details id="lightpanel"><summary>Lighting</summary><div id="lighting"></div></details>
  <div id="newgroup">
    <strong>+ New group</strong>
    <span>drop a NIfTI here, or click</span>
  </div>
  <div id="add">
    <button id="b-mesh">+ Mesh</button>
    <button id="b-fibers">+ Fibers</button>
    <button id="b-volume">+ Volume</button>
    <button id="b-slices">+ Slices</button>
    <button id="b-electrode" title="a Lead-DBS reconstruction or electrode model">+ Electrode</button>
  </div>
</div>

<div id="view">
  <div id="viewbar">
    <button data-view="left">Left</button>
    <button data-view="right">Right</button>
    <button data-view="anterior">Ant</button>
    <button data-view="posterior">Post</button>
    <button data-view="superior">Sup</button>
    <button data-view="inferior">Inf</button>
    <span class="spacer"></span>
    <button id="b-anim" title="record the view as a GIF, or move the camera along a path">Animate</button>
    <button id="b-hires" title="real tube geometry for fibres — slower">Hi-res</button>
    <button id="b-reset">Reset view</button>
  </div>
  <div id="stage"><img id="shot" alt=""><div id="spin"></div></div>
  <div id="status">ready</div>
</div>

<div id="modal"><div class="box">
  <h2 id="m-title">Choose a file</h2>
  <div class="cwd"><button id="m-up">↑</button><input id="m-path" type="text"></div>
  <div id="list"></div>
  <footer><input id="m-name" type="text" placeholder="file name"><button id="m-folder" title="use every volume in the folder shown above">Use this folder</button><button id="m-cancel">Cancel</button><button id="m-ok" class="primary">Choose</button></footer>
</div></div>

<script src="/static/app.js"></script>
</body>
</html>
