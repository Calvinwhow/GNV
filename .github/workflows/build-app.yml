name: Build app

# Builds the viewer for macOS (Apple Silicon and Intel) and Windows on every
# push to main and publishes the builds as a new GitHub Release, tagged
# v<version in pyproject.toml>-build.<run number> (v0.1.0-build.42), with the
# download and install instructions in packaging/RELEASE_NOTES.md. Pushing a
# v* tag yourself (git tag v0.2.0 && git push origin v0.2.0) releases under that
# tag instead. See packaging/README.md.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

permissions:
  contents: write          # only used to attach builds to a release on a v* tag

env:
  # The renderer. CIRCUITPYPER_TOKEN (a repository secret) is only needed while
  # CircuitPyPer is private: a fine-grained token with read access to it.
  CIRCUITPYPER_REPO: github.com/Calvinwhow/CircuitPyPer.git
  CIRCUITPYPER_REF: development

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS-arm64
            runner: macos-15
          - name: macOS-x64
            runner: macos-15-intel
          - name: Windows-x64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: packaging/requirements.txt

      - name: Install build dependencies
        run: python -m pip install -r packaging/requirements.txt

      - name: Install circuit_pyper's light install (tract file reading)
        env:
          TOKEN: ${{ secrets.CIRCUITPYPER_TOKEN }}
        run: python -m pip install "git+https://${TOKEN:+x-access-token:${TOKEN}@}${CIRCUITPYPER_REPO}@${CIRCUITPYPER_REF}"

      - name: Build
        run: python -m PyInstaller --noconfirm --clean packaging/GeneralNeuroimageViewer.spec

      - name: Check the build serves its data
        env:
          GNV_HOME: ${{ runner.temp }}/gnv-home
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            "dist/General Neuroimage Viewer.app/Contents/MacOS/GeneralNeuroimageViewer" --check
          else
            dist/GeneralNeuroimageViewer/GeneralNeuroimageViewer.exe --check || { cat "$GNV_HOME/launcher.log" 2>/dev/null; exit 1; }
            cat "$GNV_HOME/launcher.log" 2>/dev/null || true
          fi

      - name: Package for macOS (drag-to-Applications disk image)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist/dmg
          cp -R "dist/General Neuroimage Viewer.app" dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "General Neuroimage Viewer" -srcfolder dist/dmg -ov -format UDZO "dist/GeneralNeuroimageViewer-${{ matrix.name }}.dmg"
          echo "PACKAGE=dist/GeneralNeuroimageViewer-${{ matrix.name }}.dmg" >> "$GITHUB_ENV"

      - name: Package for Windows (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\GeneralNeuroimageViewer" -DestinationPath "dist\GeneralNeuroimageViewer-${{ matrix.name }}.zip"
          "PACKAGE=dist/GeneralNeuroimageViewer-${{ matrix.name }}.zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: GeneralNeuroimageViewer-${{ matrix.name }}
          path: ${{ env.PACKAGE }}
          if-no-files-found: error

  release:
    name: Publish the release
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download builds
        uses: actions/download-artifact@v7
        with:
          path: builds
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
            TAG="v${VERSION}-build.${GITHUB_RUN_NUMBER}"
          fi
          cp packaging/RELEASE_NOTES.md notes.md
          printf '\n---\nBuilt from commit %s: %s\n' "${GITHUB_SHA:0:7}" "$(git log -1 --pretty=%s)" >> notes.md
          gh release create "$TAG" builds/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "General Neuroimage Viewer $TAG" --notes-file notes.md --latest
